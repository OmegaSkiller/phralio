name: phralio
description: An offline reader with controlled cadence and a stable focal point.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.4
  characters: ^1.4.1
  path: ^1.9.1
  lucide_icons_flutter: ^3.1.20
  file_selector: ^1.1.0
  archive: ^4.3.0
  xml: ^7.0.1
  html: ^0.15.7
  crypto: ^3.0.7
  http: ^1.6.0
  markdown: ^7.3.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  file_selector_platform_interface: ^2.7.0
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.4.3
flutter:
  generate: true
  uses-material-design: true
  assets:
    - third_party/licenses/lucide-upstream.txt
    - assets/brand/
    - assets/fonts/IBMPlexSans-OFL.txt
    - assets/fonts/Newsreader-OFL.txt
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
